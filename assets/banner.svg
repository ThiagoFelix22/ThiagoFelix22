<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Thiago Felix, Desenvolvedor Front-End">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151b2b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; }
      .code { font-size: 15px; }
      .kw { fill: #ff7b72; } .var { fill: #79c0ff; } .str { fill: #a5d6ff; }
      .p { fill: #c9d1d9; } .key { fill: #d2a8ff; } .bool { fill: #79c0ff; }
      .line { opacity: 0; animation: show 0.5s ease forwards; }
      .l1 { animation-delay: 0.3s; } .l2 { animation-delay: 0.7s; } .l3 { animation-delay: 1.1s; }
      .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 1.9s; } .l6 { animation-delay: 2.3s; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1000" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="16" fill="url(#grid)"/>

  <!-- texto principal -->
  <text x="56" y="92" font-size="18" fill="#7d8590">&lt;dev&gt;</text>
  <text class="title" x="56" y="160" font-size="62" fill="url(#name)">Thiago Felix</text>
  <text x="58" y="200" font-size="22" fill="#e6edf3">Desenvolvedor Front-End</text>
  <text x="58" y="234" font-size="16" fill="#7d8590">React  ·  TypeScript  ·  Tailwind CSS</text>
  <text x="56" y="282" font-size="18" fill="#7d8590">&lt;/dev&gt;</text>

  <!-- janela de editor -->
  <g>
    <rect x="560" y="40" width="388" height="240" rx="12" fill="#0b0f16" stroke="#30363d"/>
    <path d="M560 52a12 12 0 0 1 12-12h364a12 12 0 0 1 12 12v24H560z" fill="#161b22"/>
    <circle cx="582" cy="58" r="6" fill="#ff5f56"/>
    <circle cx="602" cy="58" r="6" fill="#ffbd2e"/>
    <circle cx="622" cy="58" r="6" fill="#27c93f"/>
    <text x="754" y="63" font-size="12" fill="#7d8590" text-anchor="middle">thiago.ts</text>

    <g class="code" xml:space="preserve">
      <text class="line l1" x="584" y="110"><tspan class="kw">const</tspan> <tspan class="var">thiago</tspan> <tspan class="p">= {</tspan></text>
      <text class="line l2" x="608" y="136"><tspan class="key">role</tspan><tspan class="p">: </tspan><tspan class="str">"Front-End"</tspan><tspan class="p">,</tspan></text>
      <text class="line l3" x="608" y="162"><tspan class="key">stack</tspan><tspan class="p">: [</tspan><tspan class="str">"React"</tspan><tspan class="p">, </tspan><tspan class="str">"TypeScript"</tspan><tspan class="p">],</tspan></text>
      <text class="line l4" x="608" y="188"><tspan class="key">sempreAprendendo</tspan><tspan class="p">: </tspan><tspan class="bool">true</tspan><tspan class="p">,</tspan></text>
      <text class="line l5" x="608" y="214"><tspan class="key">abertoAOportunidades</tspan><tspan class="p">: </tspan><tspan class="bool">true</tspan><tspan class="p">,</tspan></text>
      <text class="line l6" x="584" y="240"><tspan class="p">};</tspan></text>
      <rect class="cursor" x="608" y="228" width="9" height="16" fill="#58a6ff"/>
    </g>
  </g>
</svg>
